services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-lawdiff}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lawdiff}
      POSTGRES_DB: ${DB_DATABASE:-lawdiff}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - lawdiff-postgres:/var/lib/postgresql/data
      # Runs once, on an empty data directory: phpunit.xml points the suite at a
      # separate database so a test run cannot truncate the working corpus.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-lawdiff}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lawdiff-postgres:
