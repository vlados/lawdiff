name: daily-export

on:
  schedule:
    # 06:00 UTC = 09:00 Europe/Sofia
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force-refetch:
        description: 'Re-fetch contents even if already present'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      reprocess:
        description: 'Rebuild every law_node from stored content (no re-fetching)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: daily-export
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_REFETCH: ${{ github.event.inputs.force-refetch || 'false' }}
      REPROCESS: ${{ github.event.inputs.reprocess || 'false' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lawdiff
          POSTGRES_PASSWORD: lawdiff
          POSTGRES_DB: lawdiff
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can push a meaningful commit back
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: mbstring, pdo_pgsql, intl
          coverage: none

      - name: Configure Flux Pro credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.4-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          {
            echo ""
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=lawdiff"
            echo "DB_USERNAME=lawdiff"
            echo "DB_PASSWORD=lawdiff"
            echo "SESSION_DRIVER=array"
            echo "CACHE_STORE=array"
            echo "QUEUE_CONNECTION=sync"
          } >> .env
          mkdir -p database
          php artisan key:generate --no-interaction

      # The service container is empty on every run, so without this the job
      # would re-fetch all 424 laws from APIS.BG daily and blow the timeout.
      # The cached artifact is a pg dump rather than a database file.
      - name: Restore database snapshot from previous run
        id: db-cache
        uses: actions/cache@v4
        with:
          path: database/snapshot.dump
          key: lawdiff-pgdump-${{ github.run_id }}
          restore-keys: |
            lawdiff-pgdump-

      # pg_dump/pg_restore run inside the service container so their version
      # always matches the server, whatever client the runner image ships.
      - name: Load snapshot into the database
        run: |
          if [ -s database/snapshot.dump ]; then
            docker exec -i ${{ job.services.postgres.id }} \
              pg_restore -U lawdiff -d lawdiff --no-owner --no-privileges \
              < database/snapshot.dump
          else
            echo "No snapshot cached; starting from an empty database."
          fi

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Fetch law list
        run: php artisan laws:fetch --no-interaction

      - name: Fetch law contents
        run: |
          ARGS="--no-interaction"
          if [ "${FORCE_REFETCH}" = "true" ]; then
            ARGS="${ARGS} --force"
          fi
          php artisan laws:fetch-contents ${ARGS}

      # laws:fetch-contents only rebuilds the tree of a law it just re-fetched,
      # so without this a parser change never reaches laws already in the cache.
      # The plain run is a safety net for anything left unprocessed; --force
      # rebuilds the whole corpus from stored content and needs no network.
      - name: Process law trees
        run: |
          ARGS="--no-interaction"
          if [ "${REPROCESS}" = "true" ]; then
            ARGS="${ARGS} --force"
          fi
          php artisan laws:process-trees ${ARGS}

      - name: Export public dataset
        run: php artisan laws:export-public --prune --no-interaction

      # Reads data/index.json to keep slugs aligned with the export above, so it
      # must run after it. Fails the job rather than committing a gutted dataset.
      - name: Export ИЕПС dataset
        run: php artisan laws:export-ieps --prune --no-interaction

      # Runs even when an export guard trips: the fetch is the expensive part of
      # the job and is worth keeping regardless of what the export decided.
      - name: Snapshot the database for the next run
        if: always()
        run: |
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U lawdiff -d lawdiff --format=custom --no-owner --no-privileges \
            > database/snapshot.dump

      - name: Inspect changes
        id: diff
        run: |
          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --staged --stat
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'lawdiff-bot'
          git config user.email 'lawdiff-bot@users.noreply.github.com'
          COUNT=$(jq -r '.count' data/index.json)
          git commit -m "data: daily refresh ($(date -u +%Y-%m-%d), ${COUNT} laws)"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
